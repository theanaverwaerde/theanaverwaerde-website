- name: LowSignal
  type: Game Jam
  description: |
    First game made with Godot Engine in 72h for the Ludum Dare 59 with an 3d artist (first time on Godot for her too), the theme was "Signal".
    A lot of small difficulties from this first project, about performance (running an outdoor 3d game on web is quite heavy), the phone on the game because we are interacting in a 2d element with a 3d scene.
    But a lot of new things were learned like the base of shader on Godot, all the node logic of Godot. Globally it's a really good experience this not be my last Godot game for a jam!
